<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SP Ensemble Sandbox{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.32.0/plotly.min.js"></script>
</head>
<body>

  <nav class="topnav">
    <div class="nav-left">
      <div class="nav-brand">SP Ensemble Sandbox</div>
      <div class="nav-links">
        <a href="/dashboard" class="{{ 'active' if request.path in ('/', '/dashboard') else '' }}">Dashboard</a>
        <a href="/events" class="{{ 'active' if request.path == '/events' else '' }}">Events</a>
        <a href="/rules" class="{{ 'active' if request.path == '/rules' else '' }}">Rules</a>
        <a href="/experiments" class="{{ 'active' if request.path == '/experiments' else '' }}">Experiments</a>
      </div>
    </div>
    {% if stub_mode %}
    <div class="stub-badge">STUB MODE — placeholder predictions only</div>
    {% endif %}
  </nav>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
